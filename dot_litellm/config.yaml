litellm_settings:
  drop_params: true
  callbacks: degrade_alert.proxy_handler_instance
router_settings:
  enable_pre_call_checks: true
  num_retries: 1
  allowed_fails: 3
  retry_policy:
    RateLimitErrorRetries: 0
  cooldown_time: 600
  fallbacks:
  - worker-a:
    - or-nemotron-ultra
    - gemini-flash
    - ol-nemotron-super
    - cf-gpt-oss-120b
    - kilo-step
    - zai-glm-4.7
    - mistral-codestral
    - cohere-command-a
    - ol-nemotron-nano
    - zai-glm-4.5
    - cf-llama-3.3
    - pollinations
  - worker-b:
    - gemini-flash
    - ol-gemma4
    - or-nemotron-ultra
    - cf-nemotron-super
    - groq-gpt-oss-120b
    - zai-glm-4.7
    - mistral-codestral
    - groq-gpt-oss-20b
    - zai-glm-4.5
    - cf-llama-3.3
    - pollinations
  - worker-c:
    - mistral-codestral
    - gemini-flash
    - or-nemotron-ultra
    - cf-nemotron-super
    - ol-gpt-oss-120b
    - kilo-step
    - zai-glm-4.7
    - cohere-command-a
